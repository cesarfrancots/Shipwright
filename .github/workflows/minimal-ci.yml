name: minimal-ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MCP test dependency
        run: python -m pip install -r requirements-mcp.txt

      - name: Run repository harness
        run: python scripts/validate_repo.py

      - name: Run Shipwright Obsidian MCP tests
        run: python -m unittest discover -s shipwright_obsidian_mcp/tests -t . -p "test_*.py"
